
name: Deploy Spirit Fox to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "Web-Development/spirit-fox-the-lost-magic/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Spirit Fox game
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Web-Development/spirit-fox-the-lost-magic"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
